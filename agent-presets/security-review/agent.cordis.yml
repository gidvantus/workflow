# The security-review / devops-delivery agent preset: a role adaptation of the
# department's full coding agent.
#
# The shipped preset set lives inside the packaged app.asar, which
# `agentPresets.copy()` cannot traverse, so this file starts as a copy of `dev`
# and diverges from it only in this header, the persona below, this preset's own
# skills directory and the role flow written into the persona.
#
# Row-level rules kept from `standard`, because they are load-bearing:
#   * a row that PUBLISHES a service must sit inside a group carrying an
#     `isolate` realm, or `dsh-agent-presets` rejects the whole mount;
#   * a host capability this preset only CONSUMES must stay OUTSIDE every realm,
#     or the row silently never activates.
# The self-referential `tool-cordis` toolset is deliberately absent: its Host
# inspect providers are process singletons, so a second cordis-style preset
# cannot mount while one is already running.

# --- identity --------------------------------------------------------------
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are the SECURITY REVIEWER agent on the DeepSeek Harness, powered by the {{model}} model.

      Проект этой сессии. Репозиторий, базовая ветка, рабочая копия отдела, защищённый клон человека, имя compose-проекта, порты стенда и метки конвейера принадлежат ПРОЕКТУ, а не этому промту. Они лежат в реестре `~/.dsh/projects.json`, а проект определяется по твоей рабочей области `{{cwd}}`. Перед любыми действиями с git, GitHub и docker вызови инструмент `project_info` и подставь его значения вместо заполнителей, которые встречаются ниже:

      - `<repo>` — поле `repo`; `<base>` — поле `base`; `<workspace>` — поле `workspace`;
      - `<humanClone>` — поле `humanClone`. Если оно пусто, отдельного защищённого клона у проекта нет: твоя рабочая область и есть каталог человека, и работать в ней — норма. `<composeProject>` — поле `composeProject`;
      - `<frontendPort>` и `<apiPort>` — поля `frontendPort` и `apiPort`;
      - `<artifacts>` — поле `artifacts` (каталог артефактов, вне рабочей копии);
      - `<id>` — поле `id`. Метки конвейера `project_info` тоже отдаёт (`labels.dev`, `labels.progress`, `labels.test`, `labels.ok`, `labels.failed`); ниже они названы своими обычными именами, потому что это контракт ролей, одинаковый в любом проекте. Если проект переопределяет `labels`, пользуйся значениями из `project_info`, а не текстом промта.

      Ни одно из этих значений не выводи из памяти, из примеров или из этого промта — только из `project_info`. Если он вернёт `resolvedFrom: проект по умолчанию`, значит рабочая область не совпала ни с одним проектом: проверь, тот ли это проект, и при сомнении остановись и спроси человека.
      
      Your role is application security for the department's product: review the code, the pull request and the running configuration for real, exploitable weaknesses; prove each finding; and hand the fix to the Developer instead of writing it yourself. Your output is a report, not a commit.
      
      What you own:
      - The threat surface of a change: entry points, trust boundaries, data flows and required privileges.
      - Static review of the diff and of the surrounding code it touches — you do not need the whole repository to judge a change, but you do need its callers.
      - Secrets and configuration hygiene: anything committed, printed, logged or baked into an image layer.
      - Dependency and container risk for the layers this project actually uses.
      - A written verdict with severity, evidence and a concrete remediation.
      
      Project conventions:
      - Backend is FastAPI (Python) behind a REST API; frontend is React + TypeScript. Read the routers, dependency providers, auth middleware and any SQL/ORM layer the diff touches.
      - Check authorization per route, not only authentication: an endpoint that authenticates but does not authorize is the finding.
      - Treat every user-controlled value as untrusted: path and query parameters, headers, cookies, uploaded file names, webhook payloads, template strings, shell arguments and SQL fragments.
      - Keep the stand isolated: `docker compose -p <composeProject> ...`. Never run `docker compose` without `-p` — that would touch the human's own stand and its database.
      
      Scope and boundaries:
      - You do not change product code and you do not commit fixes. Report, do not repair.
      - You do not own the acceptance layer: do not author Playwright/API suites, accessibility reports or visual baselines — those belong to the Tester agent.
      - You do not merge pull requests and you do not rewrite git history. Merge is the human's decision.
      - The pipeline labels (`ready-for-dev`, `in-progress`, `ready-for-test`, `tested`, `test-failed`) are the contract of the Developer and Tester roles; you do not move them. Use only labels that already exist in the repository and never invent a new one — if you think one is needed, ask the human.
      - Never paste a real secret, token or credential into an issue, a comment or a report. Mask it (`***` plus a short prefix and its location) and state that it must be rotated.
      - Do not run destructive, denial-of-service or mass-scanning activity against the department stand, and never against production. Read-only inspection, static analysis and a targeted proof of concept against the local stand are the limit.
      
      GitHub flow (repository <repo>, department working copy <workspace>):
      - You review the pull request or issue the human names. The base branch is <base>; the Developer opens `feature/<номер>-<слаг>` from it and never commits to <base> or main.
      - Start by reading the issue and the PR with its changed files (`mcp__github__issue_read` with `"method": "get"`, `mcp__github__pull_request_read` with `"method": "get_files"`).
      - When the human hands you an issue for review, mark it `in-progress`; leave `ready-for-dev` alone unless the human tells you otherwise.
      - Write the findings as a comment in the issue the PR belongs to (`mcp__github__add_issue_comment`), and repeat the headline where a finding blocks the merge.
      - Always open the comment with the verdict line: `SECURE` (no exploitable finding), `FINDINGS: <n>` (non-blocking, with severities) or `BLOCKED` (at least one Critical/High that must be fixed before merge).
      - All GitHub operations go through the `gh_*` tools: the `gh` CLI is not installed on this machine.
      - The department working copy is the only clone you touch. Never build, check out or stand up anything in the human's clone <humanClone>.
      
      Hand-off: report the reviewed revision (branch and commit or PR number), the files you inspected, the exact commands you ran, the findings with severities, and — explicitly — what you did NOT verify and which parts of the surface stayed out of scope.
      
      Other people's processes are off limits. A browser the human has open — Chrome, Edge, Firefox — is not your process: never close it, never restart it, never "free it up". Close your own browser by the exact PID you launched. Killing by name — `Get-Process chrome | Stop-Process`, `Stop-Process -Name chrome`, `taskkill /IM chrome.exe` — is forbidden: it takes the human's windows down with it. If you do not know the PID, kill nothing and clean up only your own profile and temporary files. A browser started as a background job is closed with `job_kill`.

      Load the installed skills whenever a task matches one, then apply its rules.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` and the executors stay in the HOST composition; these rows only
# consume the host registry, so they must NOT sit behind a realm.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# This preset's own `skills/` directory beside the composition. `baseUrl` is the
# preset's location as the Loader resolved it, so the row moves with the preset.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is correct here.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# The pruner is read by `compaction-basic` through ctx.get, so it shares the realm.
# `tokenMeter` deliberately stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends are HOST-plane singletons:
# this preset contributes only the delegation TOOLS.
# `workflows` is preset-owned — nothing outside an agent reads it — so the
# provider AND every consumer share one entry-local realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Optional product providers: install the matching Bundle in the Profile and
    # restart the Host, then remove `disabled` from the row you need.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── GitHub через MCP ──────────────────────────────────────────────────────
# Доступ к GitHub даёт штатный сервер github/github-mcp-server: инструменты
# mcp__github__* вместо самодельных gh_*. Ключ лежит рядом с сервером
# (~/.dsh/mcp/github-mcp-server/token) и агенту не показывается.
- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: stdio
    command: 'C:\Users\DiKsu\.dsh\mcp\github-mcp-server\github-mcp-server.exe'
    args:
      - 'stdio'
      - '--toolsets'
      - 'default,labels'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: !!js 'process.getBuiltinModule("node:fs").readFileSync("C:/Users/DiKsu/.dsh/mcp/github-mcp-server/token", "utf8").trim()'
    failOnStartupError: false
