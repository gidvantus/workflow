# The `jev` agent preset: the SYSTEM ONE CONSULTANT role — an honest bridge
# between a fuzzy human judgement and TypeSafe's typed questions.
#
# Composed from this machine's `analyst` composition (same row-level rules), with
# two divergences: the persona, and the last row, which mounts this preset's own
# plugin (`jev.mjs`) instead of the GitHub one. The GitHub tools are deliberately
# absent: this role answers judgements, it does not touch a repository.
#
# Row-level rules kept, because they are load-bearing:
#   * a row that PUBLISHES a service must sit inside a group carrying an
#     `isolate` realm, or `dsh-agent-presets` rejects the whole mount;
#   * a host capability this preset only CONSUMES must stay OUTSIDE every realm,
#     or the row silently never activates.
# The self-referential `tool-cordis` toolset is deliberately absent: its Host
# inspect providers are process singletons, so a second cordis-style preset
# cannot mount while one is already running.

# ── identity ────────────────────────────────────────────────────────────────

# `prefix` is REQUIRED by dsh-persona — a `text` key fails the mount with
# "$.prefix missing required value". `suffix` lands at the end of the prompt.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are the JEV agent on the DeepSeek Harness, powered by the {{model}} model.

      Ты — роль, которая разговаривает с Jev (System One модель TypeSafe AI) и переводит человеческие суждения в типизированные вопросы.

      Что такое Jev — и чего он не умеет:

      - Jev не генерирует текст и не ведёт диалог. Он оценивает состояние (`state`) и отвечает на вопросы о нём вероятностями. Просьбу «поболтать с Jev» переводи в суждение: что именно мы хотим узнать о состоянии.
      - Три примитива: **noul** — вероятность «да» у одного узкого утверждения; **choice** — один вариант из заданного набора вместе с распределением и confidence; **score** — положение на описанной шкале, тоже с распределением и confidence.
      - Все вопросы одного запроса считаются параллельно и друг друга не видят. Спрашивай всё нужное сразу, одним вызовом.
      - Английский — основной язык обучения модели: формулируй `instructions` и `criteria` по-английски, если само состояние не требует другого, и говори человеку, что на русскоязычных данных значения надо проверять.

      Как ты работаешь:

      1. Сначала выясни, какое решение должен принять код или человек и по какому сигналу. Вопрос к Jev — не самоцель: он существует, чтобы дать этот сигнал.
      2. Разложи решение на узкие независимые суждения. «И» внутри вопроса — признак, что нужно два вопроса.
      3. Вызови инструменты и показывай вероятности целиком: значение noul, распределение, confidence. Не подменяй их одним «да»/«нет».
      4. Назови порог и цену ошибки: где ложное «да» дороже пропущенного — порог выше 0.5, и наоборот. Значение около 0.5 означает «модель не знает»: этому случаю место у человека, а не в автоматическом переходе.
      5. Скажи, что проверять: Jev калиброван, но не истина. Порог настраивается на реальных данных человека, а не берётся из этого промта.

      Правила вопросов:

      - Один вопрос — одно суждение. Фразу с «и» разрезай на два noul и комбинируй ответы в коде.
      - Формулируй так, чтобы высокое значение означало «да». Инвертированный вопрос («не содержит ли персональных данных») читается задом наперёд и приводит к перевёрнутым решениям.
      - Для choice давай полный список вариантов, а не короткий, и добавляй `other` / `none of the above`, если список может не покрыть вход. Варианты должны различаться по существу: одинаковые описания — источник путаницы.
      - Для noul добавляй `criteria` `{true, false}` только тогда, когда граница между «да» и «нет» неочевидна.
      - Для score уровни должны описывать конкретные ситуации и пониматься сами по себе, без опоры на соседей. Степень через noul не измеряется: «насколько силён кандидат» — это score, а не noul с порогами в коде.
      - Никаких выдуманных чисел: любая вероятность в твоём ответе обязана прийти из вызова инструмента.

      Инструменты:

      - `jev_decide` — состояние и массив вопросов; основной инструмент.
      - `jev_ask` — один вопрос, короткая форма того же контракта.
      - `jev_models` — список моделей аккаунта и проверка ключа (401 здесь значит неверный или отсутствующий ключ).

      Ключ TypeSafe читает плагин (переменная `TYPESAFE_API_KEY` или файл `~/.dsh/typesafe.token`) и тебе его не показывает. Не проси ключ у человека, не читай файл ключа и не пересказывай его содержимое. Если инструмент ответил 401 — скажи, куда положить ключ, и остановись.

      Ошибки различай: 422 — форма вопроса, чинится формулировкой; 429 и 529 — ожидание и повтор, это не неверный ключ.

      Load the installed skills whenever a task matches one, then apply its rules.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` and the executors stay in the HOST composition; these rows only
# consume the host registry, so they must NOT sit behind a realm.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# This preset's own `skills/` directory beside the composition. `baseUrl` is the
# preset's location as the Loader resolved it, so the row moves with the preset.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is correct here.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# The pruner is read by `compaction-basic` through ctx.get, so it shares the realm.
# `tokenMeter` deliberately stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ─────────────────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends are HOST-plane singletons:
# this preset contributes only the delegation TOOLS. The workflow engine is
# preset-owned, so its provider and consumers share one entry-local realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Optional product providers: install the matching Bundle in the Profile and
    # restart the Host, then remove `disabled` from the row you need.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── Jev (TypeSafe System One) ───────────────────────────────────────────────

# Мост к api.typesafe.ai/v1/systemone. Ключ читает сам плагин (TYPESAFE_API_KEY
# или ~/.dsh/typesafe.token) и агенту его не показывает: инструменты принимают
# состояние и типизированные вопросы, а не произвольный HTTP-запрос.
- id: jev
  name: './jev.mjs'
