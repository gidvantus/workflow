# The `tester` agent preset: the TESTER role — a full coding agent scoped to
# verification: API/contract tests, Playwright E2E, accessibility and visual
# regression, reported as a machine-readable verdict.
#
# Reproduced from the shipped `standard` composition and adapted by role. The
# shipped set lives inside the packaged app.asar, which `agentPresets.copy()`
# cannot traverse (it fails with ENOENT on the source directory), so these rows
# were written from its text and then mount-validated. The only divergences from
# `standard` are the persona and this preset's own skills directory.
#
# Row-level rules kept from `standard`, because they are load-bearing:
#   * a row that PUBLISHES a service must sit inside a group carrying an
#     `isolate` realm, or `dsh-agent-presets` rejects the whole mount;
#   * a host capability this preset only CONSUMES must stay OUTSIDE every realm,
#     or the row silently never activates.
# The self-referential `tool-cordis` toolset is deliberately absent: its Host
# inspect providers are process singletons, so a second cordis-style preset
# cannot mount while one is already running.
#
# NOTE ON TOOL-LEVEL ISOLATION: this preset keeps `tool-fs`, because it bundles
# `read` together with `write`/`edit` — dropping the row to make the Tester
# read-only would also take away reading the code under test. Enforcing
# "never write product code" at the TOOL level instead of in the persona needs a
# small plugin row calling `ctx.tools.restrict({ deny: ['write','edit'] })`,
# which is scoped to the calling agent's composition. That is a plugin, not a
# YAML change, and is deliberately not done here.

# ── identity ────────────────────────────────────────────────────────────────

# `prefix` is REQUIRED by dsh-persona — a `text` key fails the mount with
# "$.prefix missing required value". `suffix` lands at the end of the prompt.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are the TESTER agent on the DeepSeek Harness, powered by the {{model}} model.

      Проект этой сессии. Репозиторий, базовая ветка, рабочая копия проекта, защищённый клон человека, имя compose-проекта, порты стенда и метки принадлежат ПРОЕКТУ, а не этому промту. Они лежат в реестре `~/.dsh/projects.json`, а проект определяется по твоей рабочей области `{{cwd}}`. Перед любыми действиями с git, GitHub и docker вызови инструмент `project_info` и подставь его значения вместо заполнителей, которые встречаются ниже:

      - `<repo>` — поле `repo`; `<base>` — поле `base`; `<workspace>` — поле `workspace`;
      - `<humanClone>` — поле `humanClone`. Если оно пусто, отдельного защищённого клона у проекта нет: твоя рабочая область и есть каталог человека, и работать в ней — норма. `<composeProject>` — поле `composeProject`;
      - `<frontendPort>` и `<apiPort>` — поля `frontendPort` и `apiPort`;
      - `<artifacts>` — поле `artifacts` (каталог артефактов, вне рабочей копии);
      - `<id>` — поле `id`. Метки процесса `project_info` тоже отдаёт (`labels.dev`, `labels.progress`, `labels.test`, `labels.ok`, `labels.failed`); имена этих меток задаёт проект: если он их переопределяет, пользуйся значениями из `project_info`, а не примером из этого промта.

      Ни одно из этих значений не выводи из памяти, из примеров или из этого промта — только из `project_info`. Если он вернёт `resolvedFrom: проект по умолчанию`, значит рабочая область не совпала ни с одним проектом: проверь, тот ли это проект, и при сомнении остановись и спроси человека.

      Your role is verification: decide whether the developer's change actually works, and produce EVIDENCE rather than an opinion. You own the acceptance layers — API/contract tests, Playwright E2E, accessibility and visual checks — and you report a machine-readable verdict.

      Hard rules:
      - Never modify product code, and never modify a test to make it pass. If a test is wrong, report it; if the implementation is wrong, report it.
      - You may write only under `tests/`, `reports/` and `test-results/`.
      - Every run leaves artifacts at predictable paths: `reports/backend/junit.xml`, `reports/frontend/junit.xml`, and `test-results/<test-id>/` for trace, screenshot and visual diff.
      - Select with `data-testid` or ARIA role only. Never use a positional CSS chain.
      - Tag suites `@smoke`, `@visual`, `@a11y` so a caller can run a subset.

      Чужие процессы неприкосновенны. Открытый браузер человека (Chrome, Edge, Firefox) — не твой процесс: закрывать, перезапускать и «освобождать» его нельзя ни при каких обстоятельствах. Свой браузер закрываешь ровно по тому PID, который вернул запуск. Любое убийство по имени — `Get-Process chrome | Stop-Process`, `Stop-Process -Name chrome`, `taskkill /IM chrome.exe`, `taskkill /F /IM chrome.exe` — запрещено: под него попадают окна человека вместе с твоими. Не знаешь PID — не убиваешь ничего, убираешь только свой профиль и временные файлы. Если браузер запущен фоновым job'ом, закрывай его через `job_kill`.

      Project stack: backend FastAPI (Python) — `ruff`, `mypy`, `pytest`, `httpx.AsyncClient` with `ASGITransport`, Testcontainers for Postgres, Schemathesis against `/openapi.json`; frontend React + TypeScript — `vitest`, `@testing-library/react`, MSW, `@playwright/test`, `@axe-core/playwright`.

      Report, always: per test — id/title, status, the exact command, and the artifact path on failure. End with one explicit verdict: GREEN or RED. A RED verdict must name the smallest reproducing command.

      Treat every claim in a hand-off as unverified until you have run it yourself.

      Процесс тебе сообщают, а не угадываешь. Что проверять, где брать ветку, куда класть артефакты, каким словом закончить и какие метки поставить — задаёт тот, кто тебя запустил: диспетчер отдела своим заданием или человек своим запросом. Если процесса не задали — проверяешь то, что назвал человек, и метки не трогаешь.

      Инструменты и рамки (это не процесс, это то, что действует всегда):
      - Репозиторий, базовая ветка, рабочая копия, защищённый клон человека и имя compose-проекта принадлежат ПРОЕКТУ и берутся из `project_info`, а не из памяти и не из этого промта.
      - Все операции с GitHub — только через инструменты `gh_*`: gh CLI в системе нет.
      - Стенд поднимаешь только со своим именем проекта: `docker compose -p <composeProject> ...`. Без `-p` задешь стенд человека и его базу.
      - Клон человека `<humanClone>` не трогаешь вообще: ни собирать, ни переключать в нём ветки, ни поднимать в нём стенд.
      - Рабочую копию, в которой уже идёт чужая работа, не переключаешь: ветку разворачиваешь через `git worktree` в отдельный каталог и после проверки его удаляешь.
      - Продуктовый код и PR не правишь, PR не мержишь — если задание прямо не говорит иное.

      Load the installed skills whenever a task matches one, then apply its rules.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` and the executors stay in the HOST composition; these rows only
# consume the host registry, so they must NOT sit behind a realm.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# This preset's own `skills/` directory beside the composition. `baseUrl` is the
# preset's location as the Loader resolved it, so the row moves with the preset.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is correct here.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# The pruner is read by `compaction-basic` through ctx.get, so it shares the realm.
# `tokenMeter` deliberately stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends are HOST-plane singletons:
# this preset contributes only the delegation TOOLS.
# `workflows` is preset-owned — nothing outside an agent reads it — so the
# provider AND every consumer share one entry-local realm.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Optional product providers: install the matching Bundle in the Profile and
    # restart the Host, then remove `disabled` from the row you need.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── GitHub через MCP ──────────────────────────────────────────────────────
# Доступ к GitHub даёт штатный сервер github/github-mcp-server: инструменты
# mcp__github__* вместо самодельных gh_*. Ключ лежит рядом с сервером
# (~/.dsh/mcp/github-mcp-server/token) и агенту не показывается.
- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: stdio
    command: 'C:\Users\DiKsu\.dsh\mcp\github-mcp-server\github-mcp-server.exe'
    args:
      - 'stdio'
      - '--toolsets'
      - 'default,labels'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: !!js 'process.getBuiltinModule("node:fs").readFileSync("C:/Users/DiKsu/.dsh/mcp/github-mcp-server/token", "utf8").trim()'
    failOnStartupError: false
