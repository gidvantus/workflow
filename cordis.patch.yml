# Патч бандла `dsh-dev-department`: слой композиции профиля, который едет вместе
# с пакетом. `dsh plugin add github:gidvantus/workflow#<commit>` кладёт пакет
# зависимостью профиля и дописывает его имя в `dsh.profile.bundles`, а DSH
# применяет этот патч после бандлов `@deepseek-ai/dsh-base` и
# `@deepseek-ai/dsh-web-app` — то есть после строк, которые он правит ниже.
#
# ВАЖНО: строки адресуются спецификатором пакета, а не относительным путём.
# Относительный `./plugins/…` резолвится от каталога композиции (то есть от
# профиля), а не от каталога пакета; ошибка в спецификаторе видна на старте как
# «плагин не найден».
#
# ВАЖНО: каждая вставленная строка обязана объявить в inject все хост-сервисы,
# которые потребляет. Записи отсюда применяются РАНЬШЕ, чем бандлы публикуют
# свои сервисы, и Cordis не откладывает плагин, если зависимости не объявлены, —
# он запускает его в пустом окружении, и тот молча ничего не делает.

# ── Пресеты ролей ────────────────────────────────────────────────────────────
#
# Десять каталогов ролей лежат внутри этого же пакета (`agent-presets/`), поэтому
# копировать их в `~/.dsh/.agent-presets` не нужно: строка `agent-presets`
# получает корень с trust `system`. Пресеты системного корня — только чтение
# (`agentPresets.copy()` для них не работает): правка роли идёт через git, а не
# через каталог установки.
#
# Патч заменяет config строки ЦЕЛИКОМ (`applyEntryPatches` присваивает ключ, а не
# смешивает значения). Поэтому `default`, `includeShippedRoot` и
# `includeUserRoot` повторены здесь в прежних значениях: `default` — обязательное
# поле ростера, без него строка не загрузится, а выключенный `include*` молча
# убрал бы штатные (`includeShippedRoot`) или пользовательские
# (`includeUserRoot`) пресеты из списка.
#
# `!!js` вычисляется при активации строки как `with (ctx) { eval(expr) }`, где
# `baseUrl` — каталог профиля. Резолв имени пакета идёт обычным правилом Node от
# профиля, то есть попадает в `profiles/<профиль>/node_modules/…`, куда пакет и
# ставит `dsh plugin add`; `./package.json` в `exports` пакета нужен именно для
# этого resolve. Скаляр обязан быть в кавычках: без них YAML-парсер падает на
# `: ` внутри выражения.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    includeShippedRoot: true
    includeUserRoot: true
    roots:
      - path: !!js 'process.getBuiltinModule("node:path").join(process.getBuiltinModule("node:path").dirname(process.getBuiltinModule("node:module").createRequire(baseUrl).resolve("dsh-dev-department/package.json")), "agent-presets")'
        trust: system

# ── Хост-плоскость отдела ────────────────────────────────────────────────────
- insert:
    # Мост в Telegram: сводка смены уходит боту проекта из реестра.
    - id: tg-bridge
      name: 'dsh-dev-department/plugins/tg-bridge.mjs'

    # Ролевые сессии: инструменты open_role_session / list_agent_presets.
    - id: role-sessions
      name: 'dsh-dev-department/plugins/role-sessions.mjs'

    # Отдел разработки: диспетчер ролей в окне смены и сводка в Telegram.
    - id: dev-department
      name: 'dsh-dev-department/plugins/dev-department.mjs'

    # Разрешения ролей: сессиям dev/tester выдаётся danger-full-access, чтобы
    # работа не упиралась в запросы подтверждения.
    - id: role-permissions
      name: 'dsh-dev-department/plugins/role-permissions.mjs'
