server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Любой неизвестный путь отдаёт index.html: у приложения пока одна страница,
    # но SPA-раздача уже на месте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API проксируется с того же origin, поэтому CORS фронту не нужен.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Остановленный api — это 502 от nginx: его фронт показывает как «Сервер не отвечает».
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
