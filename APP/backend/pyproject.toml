[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-app-backend"
version = "0.1.0"
description = "API каркаса APP: здоровье сервиса и подключение к PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0.36,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
# Ставятся и в образ api: стенд прогоняет проверки внутри контейнера.
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
# Тексты проекта на русском: кириллические «с», «о», «у» в строках и документации —
# это не опечатки, а обычные слова.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пакет `app` лежит в корне образа (`WORKDIR /app`), а не в site-packages: установка
# editable делается до копирования исходников, поэтому pytest должен видеть корень сам.
pythonpath = ["."]
