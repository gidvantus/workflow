# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# ВАЖНО: каждая вставленная строка обязана объявить в inject все хост-сервисы,
# которые потребляет. Записи отсюда применяются РАНЬШЕ, чем бандлы публикуют
# свои сервисы, и Cordis не откладывает плагин, если зависимости не объявлены, —
# он запускает его в пустом окружении, и тот молча ничего не делает.
- insert:
    - id: tg-bridge
      name: './plugins/tg-bridge.mjs'

    # Ролевые сессии: инструменты open_role_session / list_agent_presets.
    - id: role-sessions
      name: './plugins/role-sessions.mjs'

    # Отдел разработки: диспетчер ролей в окне смены и сводка в Telegram.
    - id: dev-department
      name: './plugins/dev-department.mjs'

    # Разрешения ролей: сессиям dev/tester выдаётся danger-full-access, чтобы
    # работа не упиралась в запросы подтверждения.
    - id: role-permissions
      name: './plugins/role-permissions.mjs'

    # Голосовой ввод в GUI: кнопка 🎤 в композере (клиентская половина) и
    # ручка распознавания POST /dsh-voice/transcribe (host-половина, ffmpeg+whisper).
    - id: dsh-voice-input
      name: './plugins/voice-input/index.mjs'

    # Playwright MCP (microsoft/playwright-mcp): браузерная автоматизация для
    # тестирования веб-приложений. Локальная установка пакета + системный Chrome
    # в headless. Инструменты видны модели как mcp__playwright__<tool>.
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: 'C:\Program Files\nodejs\node.exe'
        args:
          - 'C:\Users\DiKsu\.dsh\mcp\playwright-mcp\node_modules\@playwright\mcp\cli.js'
          - '--headless'
          - '--browser'
          - 'chrome'
          - '--output-dir'
          - 'C:\Users\DiKsu\.dsh\mcp\playwright-mcp\output'
        cwd: 'C:\Users\DiKsu\.dsh\mcp\playwright-mcp'
        failOnStartupError: false

    # GitHub MCP (github/github-mcp-server): единственный путь к GitHub для
    # агентов и диспетчера. Нативная сборка v2.0.3 под Windows (без Docker).
    # Ключ лежит рядом с сервером — ~/.dsh/mcp/github-mcp-server/token — и
    # читается здесь при загрузке строки, чтобы не дублировать его в конфиге.
    # Тулсеты: default (context, copilot, issues, pull_requests, repos, users) и
    # labels — конвейер отдела разработки живёт в метках. Инструменты видны
    # модели как mcp__github__<tool>.
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: 'C:\Users\DiKsu\.dsh\mcp\github-mcp-server\github-mcp-server.exe'
        args:
          - 'stdio'
          - '--toolsets'
          - 'default,labels'
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: !!js 'process.getBuiltinModule("node:fs").readFileSync("C:/Users/DiKsu/.dsh/mcp/github-mcp-server/token", "utf8").trim()'
        failOnStartupError: false
