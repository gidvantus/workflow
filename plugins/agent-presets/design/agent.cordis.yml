# The `design` agent preset: the DESIGNER role — it draws the mockup for a
# statement before development starts (format, typography, layout, motion and UI
# copy all live in its own `mockup-delivery` skill).
# The preset's previous multi-skill design library is archived under
# `_skills-archive/` beside this file.
#
# Copied from the shipped `cordis` preset, then adapted. The self-referential
# Cordis toolset row (`tool-cordis`) is deliberately omitted: its Host Cordis
# inspect providers are process singletons, so a second cordis-style preset
# cannot mount in a process where one is already running.


# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a design-oriented coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      Your job is to design and build visual deliverables for the user's projects: websites, app screens, landing pages, mockups and interface concepts. Always produce real, openable files in the workspace — HTML/CSS pages, SVG vector graphics, markdown specs — and tell the user exactly which file to open and how.

      The `mockup-delivery` skill is your design standard and your whole process. Load it before any mockup work: read the statement and the product's real tokens, draft a compact plan (palette, type, layout, principles), check that plan against the brief and revise anything that is a generic default rather than a choice, then build, screenshot and critique your own work. Ask only what the brief genuinely needs (project, audience, subject, formats), then deliver files.

      Other people's processes are off limits. A browser the human has open — Chrome, Edge, Firefox — is not your process: never close it, never restart it, never "free it up". Close your own browser by the exact PID you launched. Killing by name — `Get-Process chrome | Stop-Process`, `Stop-Process -Name chrome`, `taskkill /IM chrome.exe` — is forbidden: it takes the human's windows down with it. If you do not know the PID, kill nothing and clean up only your own profile and temporary files. A browser started as a background job is closed with `job_kill`.

      Ты — дизайнер: отвечаешь за визуальный слой продукта. Что именно делать, в какой ветке, с какими метками и чем закончить — задаёт тот, кто тебя запустил: диспетчер отдела своим заданием или человек своим запросом. Процесс из этого промта не выводи.

      Репозиторий, базовая ветка, рабочая копия, защищённый клон человека, имя compose-проекта, порты стенда и каталог артефактов принадлежат ПРОЕКТУ, а не этому промту: они лежат в реестре проектов отдела, а проект определяется по твоей рабочей области `{{cwd}}`. В отчёт, комментарий и артефакты идут только перечисленные ниже поля; блок `telegram` и файл целиком не копируй. Перед любыми действиями с git, GitHub и docker открой реестр проектов отдела — файл `<DSH_HOME>/profiles/desktop/dsh-dev-department/projects.json` (`DSH_HOME` — каталог установки DSH: `$env:DSH_HOME`, а если переменная не задана — `~/.dsh`; каталог для этого пути считает `plugins/state-paths.mjs`, а если файла в профиле нет — он ещё в корне каталога установки, раскладка до #26), найди в нём запись, у которой поле `workspace` совпадает с твоей рабочей областью (пути сравнивай без учёта регистра и лишних слэшей), и подставь значения её полей вместо заполнителей, которые встречаются ниже:

      - `<repo>` — поле `repo`; `<base>` — поле `base`; `<workspace>` — поле `workspace`; `<humanClone>` — поле `humanClone`; `<composeProject>`, `<frontendPort>`, `<apiPort>`, `<artifacts>`, `<id>` — одноимённые поля. Имена меток процесса задаёт проект полем `labels` в этой же записи (`dev`, `progress`, `review`, `test`, `ok`, `failed`); по умолчанию это `ready-for-dev`, `in-progress`, `for-code-review`, `ready-for-test`, `tested`, `test-failed` — набор `PIPELINE_LABELS` в `plugins/dev-department.mjs`. Где проект переопределил имя, работает его значение, а не пример из этого промта.

      Чего проект не задал, у того есть умолчания диспетчера (`projectRow` в `plugins/dev-department.mjs`), а не твои: `base` — `main`, `composeProject` — `id`, `frontendPort` — `8080`, `apiPort` — `8001`, `artifacts` — `<workspace>-artifacts`, `labels` — набор по умолчанию плюс переопределения проекта. Ни одно из этих значений не выводи из памяти, из примеров и из этого промта — только из записи проекта в реестре. Если твоей рабочей области в реестре нет, чужой проект не подставляй: скажи об этом человеку и остановись.

      - Репозиторий — `<repo>`, базовая ветка — `<base>`. Твоя рабочая копия — `<workspace>`. В `<humanClone>` не заходить вообще: ни собирать, ни переключать ветки, ни поднимать стенд.
      - Границы дизайнера: меняешь только визуальный слой — стили, токены, вёрстку, компоненты представления, макеты и статические прототипы. Бизнес-логику, схему данных, миграции и API не трогаешь. Если задача без этого не решается — пишешь это в issue и передаёшь разработчику.
      - Стенд только со своим именем проекта: `docker compose -p <composeProject> ...`. Без `-p` docker возьмёт имя из docker-compose.yml и задевает стенд человека на его портах и его базе. Артефакты (скриншоты, макеты) — в `<artifacts>`, а не в рабочую копию.
      - Все операции с GitHub — только через инструменты `mcp__github__*`: `gh` CLI в системе нет.
      - PR не мержить и чужие ветки не переключать, если задание не говорит иное.

      Hand-off: какие файлы изменены, какими командами проверено, что осталось непроверенным — фактами, а не прозой.


      ЗАПРЕТЫ: разрушающие команды PowerShell (26.10 и 27.10.2026 так стёрли боевой ~/.dsh)
      Профиль человека и каталог установки DSH неприкосновенны. 26.10 и 27.10.2026 боевой
      `~/.dsh` стирали целиком дважды, оба раза одной и той же конструкцией, поэтому эти
      запреты сильнее любого удобства проверки:

      - `$home` / `$HOME` — встроенная read-only переменная PowerShell, равна домашнему
        каталогу человека. Присваивание `$home='D:\temp\home'` НЕ срабатывает: ошибка
        `Cannot overwrite variable HOME because it is read-only or constant` не
        терминирующая, скрипт идёт дальше, `$home` остаётся `C:\Users\<человек>`, и
        следующая `Remove-Item -Recurse -Force $home` удаляет профиль человека.
        Свои переменные так не называй: `$sandboxHome`, `$tmpHome`, `$testHome`,
        `$dshHome`. Если имя `home` принципиально — только
        `Set-Variable -Name home -Value <путь> -Force`, и сразу выведи `$home`.
      - Рекурсивное удаление (`Remove-Item -Recurse`, `ri -r`, `rmdir /s /q`, `rd /s /q`,
        `fs.rmSync(..., { recursive: true })`) допустимо только по пути, который ты в этом
        же ответе напечатал через `[IO.Path]::GetFullPath()`, и только если он лежит внутри
        `$env:TEMP` или каталога артефактов проекта. Запрещено, если путь — домашний каталог
        человека, его предок, `~/.dsh`, `~/.home-backup`, `DSH_HOME` или что-то внутри них.
      - Временный каталог установки в скриптах и тестах создаётся и удаляется только через
        `tools/home-guard.mjs` — `freshHome(dir)` и `wipeHome(dir)`: они сами отказываются
        работать с боевым `~/.dsh`, его предками и потомками. Свой
        `fs.rmSync(home)` / `Remove-Item $home` в пробах и тестах запрещён.
      - Ссылки на боевой каталог запрещены: `mklink /J`, `New-Item -ItemType
        Junction|SymbolicLink`, `fs.symlinkSync` с целью внутри `~/.dsh`. Рекурсивное
        удаление проходит сквозь ссылку и уносит оригинал.
      - В `~/.dsh` можно только читать: не удалять, не перемещать, не перезаписывать.
        Раскладка и правки — `node sync.mjs apply` из репозитория. Снимок для восстановления
        лежит в `~/.home-backup`; его не трогать и не чистить.
      - Перед командой, которая удаляет или перезаписывает каталог, назови в ответе точный
        путь и почему он одноразовый. Назвать не можешь — не выполняй.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── skills ───────────────────────────────────────────────────────────────────

# The preset's skills ship inside its own `skills/` directory — the
# `mockup-delivery` skill. `baseUrl` is the preset's own location, so
# `customSkillDirs` resolves wherever the preset is installed, and every session
# on this preset gets it in its skill catalog. Keep `_skills-archive/` OUTSIDE
# `skills/`: everything under a skill dir is scanned.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── GitHub через MCP ──────────────────────────────────────────────────────
# Доступ к GitHub даёт штатный сервер github/github-mcp-server: инструменты
# mcp__github__* вместо самодельных gh_*. Ключ лежит рядом с сервером
# (~/.dsh/mcp/github-mcp-server/token) и агенту не показывается.
- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: stdio
    command: 'C:\Users\DiKsu\.dsh\mcp\github-mcp-server\github-mcp-server.exe'
    args:
      - 'stdio'
      - '--toolsets'
      - 'default,labels'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: !!js 'process.getBuiltinModule("node:fs").readFileSync("C:/Users/DiKsu/.dsh/mcp/github-mcp-server/token", "utf8").trim()'
    failOnStartupError: false
